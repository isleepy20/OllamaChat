name: Build Signed APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK environment
        shell: bash
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"

          # Pre-accept SDK licenses
          yes | "${ANDROID_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

          # Ensure required SDK platform and build-tools are present
          if [ ! -d "${ANDROID_ROOT}/build-tools/34.0.0" ] || [ ! -d "${ANDROID_ROOT}/platforms/android-34" ]; then
            yes | "${ANDROID_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true
          fi

          # Locate build-tools directory containing zipalign and apksigner
          BUILD_TOOLS_DIR="${ANDROID_ROOT}/build-tools/34.0.0"
          if [ ! -f "${BUILD_TOOLS_DIR}/zipalign" ]; then
            BUILD_TOOLS_DIR=$(dirname "$(find "${ANDROID_ROOT}/build-tools" -name zipalign | head -n 1)")
          fi

          echo "Using Android build-tools: ${BUILD_TOOLS_DIR}"
          echo "${BUILD_TOOLS_DIR}" >> "$GITHUB_PATH"
          echo "${ANDROID_ROOT}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compile Android APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Locate compiled APK and run zipalign
        shell: bash
        run: |
          ZIPALIGN_BIN=$(which zipalign 2>/dev/null || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name zipalign | head -n 1)
          echo "Using zipalign at: $ZIPALIGN_BIN"

          echo "Listing all APKs produced by Gradle:"
          find app/build -type f -name '*.apk' -print || true

          # Target unsigned release APK first, fallback to any compiled APK
          APK_PATH=$(find app/build/outputs/apk -type f -name '*unsigned*.apk' | head -n 1)
          if [[ -z "$APK_PATH" ]]; then
            APK_PATH=$(find app/build/outputs/apk -type f -name '*.apk' ! -name '*-aligned.apk' ! -name '*-signed.apk' | head -n 1)
          fi
          if [[ -z "$APK_PATH" ]]; then
            APK_PATH=$(find app/build -type f -name '*.apk' ! -name '*-aligned.apk' ! -name '*-signed.apk' | head -n 1)
          fi

          if [[ -z "$APK_PATH" ]]; then
            echo "Error: No compiled APK found in app/build." >&2
            exit 1
          fi

          echo "Found compiled APK to align: $APK_PATH"
          APK_DIR=$(dirname "$APK_PATH")
          
          "$ZIPALIGN_BIN" -v -p 4 "$APK_PATH" "$APK_DIR/app-aligned.apk"
          "$ZIPALIGN_BIN" -c -v 4 "$APK_DIR/app-aligned.apk"

      - name: Generate test keystore on runner
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore test.keystore \
            -alias testkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass testpassword \
            -keypass testpassword \
            -dname "CN=Test, OU=Test, O=Test, L=Test, S=Test, C=US"

      - name: Sign APK with apksigner (V1, V2, V3, V4)
        shell: bash
        run: |
          APKSIGNER_BIN=$(which apksigner 2>/dev/null || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner | head -n 1)
          echo "Using apksigner at: $APKSIGNER_BIN"

          ALIGNED_APK=$(find app/build -type f -name 'app-aligned.apk' | head -n 1)
          if [[ -z "$ALIGNED_APK" ]]; then
            echo "Error: No aligned APK found to sign." >&2
            exit 1
          fi
          APK_DIR=$(dirname "$ALIGNED_APK")

          # Signs with V1, V2, V3, and V4 (which generates app-signed.apk and app-signed.apk.idsig)
          "$APKSIGNER_BIN" sign \
            --ks test.keystore \
            --ks-pass pass:testpassword \
            --ks-key-alias testkey \
            --key-pass pass:testpassword \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled true \
            --out "$APK_DIR/app-signed.apk" \
            "$ALIGNED_APK"

          echo "Verifying APK signatures..."
          "$APKSIGNER_BIN" verify --verbose --print-certs "$APK_DIR/app-signed.apk"

          echo "Listing generated signed files:"
          ls -la "$APK_DIR/app-signed.apk"*

      - name: Upload signed APK and idsig artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-signed-apk
          path: |
            **/app-signed.apk
            **/app-signed.apk.idsig
          if-no-files-found: error
          compression-level: 0
