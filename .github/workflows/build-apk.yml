name: Build Signed Debug APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install required packages
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses
          license_status=${PIPESTATUS[1]}
          set -e
          if [[ "$license_status" -ne 0 ]]; then
            echo "Android SDK license acceptance failed." >&2
            exit "$license_status"
          fi
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build signed debug APK from repository root
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify and list generated APK files
        shell: bash
        run: |
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*.apk' -print)
          if (( ${#apks[@]} == 0 )); then
            echo "No APK was generated under app/build/outputs/apk." >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            test -s "$apk"
            printf '%s\n' "$apk"
          done

      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/outputs/apk/**/*.apk'
          if-no-files-found: error
          compression-level: 0
